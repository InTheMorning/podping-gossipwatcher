name: GHCR image

# Builds the listener image of this fork on GitHub and pushes it to GHCR, so a
# host pulls a built image and keeps no Rust toolchain or build cache. It is a
# separate file from release.yml, which publishes the upstream image to Docker
# Hub, so a rebase on upstream does not touch it.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Each job gets a read-only token unless it states more.
permissions:
  contents: read

jobs:
  image:
    # Only in this fork. Upstream publishes with release.yml.
    if: github.repository_owner == 'InTheMorning'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main and sha-<commit> for each push to main; the version for a tag.
      # Pin sha-<commit> on a host, so it is clear which build runs.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/podping-gossipwatcher
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
