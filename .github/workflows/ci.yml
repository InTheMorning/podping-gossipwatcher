name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Test the iroh patch
        run: cargo test --manifest-path vendor/iroh/Cargo.toml --locked --lib queue_open_path
      - name: Build
        run: cargo build -p podping-gossipwatcher --locked
      - name: Docker build
        run: docker build -t podping-gossipwatcher-ci .
